name: long-sim

# sim/trade-why だけの計測: トレードの勝ちすぎの切り分け（human-trade-probe を試しごとに）。
on:
  push:
    branches: ['sim/**']

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 22, 33, 44, 55, 66, 77, 88]
    name: trade-why (seed ${{ matrix.seed }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe
        env:
          VARIANTS: ${{ vars.TRADE_VARIANTS }}
        run: tools/sim-harness/trade-why.sh ${{ matrix.seed }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-why-${{ matrix.seed }}
          path: out
