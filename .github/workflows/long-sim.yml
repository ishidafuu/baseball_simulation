name: long-sim

# sim/trade-why2 だけの計測: 直した後の物差しと勝ち数・人とCPUの差・トレードの効き目。
on:
  push:
    branches: ['sim/**']

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [11, 22, 33, 44, 55, 66, 77, 88, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 124]
    name: after-fix (seed ${{ matrix.seed }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe
        run: |
          S=${{ matrix.seed }}
          STAFF=advice node tools/sim-harness/probe/strength-win-probe.mjs $S > o1.log 2>&1 &
          STAFF=self node tools/sim-harness/probe/strength-win-probe.mjs $S > o6.log 2>&1 &
          node tools/sim-harness/human-trade-probe.mjs trade $S > o2.log 2>&1 &
          node tools/sim-harness/human-trade-probe.mjs none $S > o3.log 2>&1 &
          wait
          grep -h '^RESULT ' o*.log
          tail -n 3 o*.log | grep -v '^RESULT' | cut -c1-300
