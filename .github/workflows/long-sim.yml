name: long-sim

# sim/trade-why だけの計測: トレードの勝ちすぎの切り分け（human-trade-probe を試しごとに）。
on:
  push:
    branches: ['sim/**']

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116]
    name: trade-why (seed ${{ matrix.seed }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Probe
        env:
          VARIANTS: none full
        run: tools/sim-harness/trade-why.sh ${{ matrix.seed }} out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-why-${{ matrix.seed }}
          path: out
